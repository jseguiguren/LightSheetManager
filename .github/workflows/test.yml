name: Run pre-merge tests

on:
  pull_request:
    branches: [ main ]

jobs:

  maven-deploy:
    # build with maven to make sure things compile correctly, and run the unit tests

    name: Compile and test with maven
    runs-on: ubuntu-latest

    env:
      # Fork only: the Micro-Manager nightly the plugin is built against, the one the rig runs.
      # MMJ_.jar is not on Maven Central, so it is taken from that nightly's Windows installer and
      # checked against the hash of the copy the plugin was last built against. A new nightly
      # changes both lines together.
      MM_NIGHTLY: MMSetup_64bit_2.0.3_20261103.exe
      MMJ_SHA256: 44bdec861768c8871a4404db2ba5a0932629544907d795101ac71efcfa674d9b

    steps:

      - uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: 'zulu'
          # Maven's downloads from run to run: without it every run fetches every plugin from
          # Maven Central, which then answers 429 Too Many Requests now and then (run 45841240962)
          cache: 'maven'

      - name: Fetch MMJ_.jar from the Micro-Manager nightly
        run: |
          sudo apt-get install -y -q innoextract
          curl -sSfL -o "$RUNNER_TEMP/mmsetup.exe" \
            "https://download.micro-manager.org/nightly/2.0/Windows/$MM_NIGHTLY"
          innoextract -s -I app/plugins/Micro-Manager/MMJ_.jar -d "$RUNNER_TEMP/mm" "$RUNNER_TEMP/mmsetup.exe"
          mkdir -p lib
          cp "$RUNNER_TEMP/mm/app/plugins/Micro-Manager/MMJ_.jar" lib/MMJ_.jar
          echo "$MMJ_SHA256  lib/MMJ_.jar" | sha256sum -c -

      - name: Compile and test
        run: mvn -B package

      # Fork only: the built plugin, to download from the run's page and drop into mmplugins.
      # Named for the commit, so a jar on the rig says which code it is.
      - name: Keep the plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: LightSheetManager-${{ github.event.pull_request.head.sha }}
          path: target/LightSheetManager-*.jar
          if-no-files-found: error
          retention-days: 30
